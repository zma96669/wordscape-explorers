<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>词境探险队标题</title>
  <style>
    .lockup {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      padding: .55rem 1rem .55rem .55rem;
      background: #FFF8EC;
      border: 4px solid #24364B;
      border-radius: 28px;
      font-family: "Trebuchet MS", "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #24364B;
    }
    .lockup img { width: 48px; height: 48px; }
    .lockup strong { font-size: 1.8rem; letter-spacing: .06em; }
    .lockup small { display: block; font-weight: 700; color: #268574; }
  </style>
</head>
<body>
  <div class="lockup">
    <img src="app-entry.svg" alt="">
    <div>
      <strong>词境探险队</strong>
      <small>Wordscape Explorers</small>
    </div>
  </div>
</body>
</html>
