<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系列封面</title>
  <style>
    body { font-family: "Trebuchet MS", "Segoe UI", "Microsoft YaHei", sans-serif; background: #FFF8EC; color: #24364B; padding: 1rem; }
    .cover {
      width: 960px; height: 540px; max-width: 100%;
      border: 6px solid #24364B; border-radius: 28px; overflow: hidden;
      display: grid; grid-template-rows: 28% 1fr; margin-bottom: 1.2rem;
    }
    .cover header { padding: 1.2rem 1.4rem; }
    .cover h2 { margin: 0; font-size: 2rem; }
    .cover p { margin: .3rem 0 0; font-weight: 700; }
    .art { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; padding: 0 1.4rem 1rem; gap: 1rem; }
    .art img { width: 100%; height: 280px; object-fit: contain; }
    .dino { background: linear-gradient(#E7F0C8, #FFF8EC); }
    .space { background: linear-gradient(#D7E9F8, #FFF8EC); }
    .ocean { background: linear-gradient(#D8F1F0, #FFF8EC); }
  </style>
</head>
<body>
  <article class="cover dino">
    <header>
      <h2>恐龙探索</h2>
      <p>标题由页面文字渲染，不画进图片。</p>
    </header>
    <div class="art">
      <img src="../art/collectibles/dinosaur/triceratops.png" alt="三角龙">
      <img src="../art/collectibles/dinosaur/stegosaurus.png" alt="剑龙">
      <img src="../art/collectibles/dinosaur/little-tyrannosaurus.png" alt="小霸王龙">
    </div>
  </article>
  <article class="cover space">
    <header>
      <h2>太空旅行</h2>
      <p>标题由页面文字渲染，不画进图片。</p>
    </header>
    <div class="art">
      <img src="../art/collectibles/space/rocket.png" alt="小火箭">
      <img src="../art/collectibles/space/star-robot.png" alt="星际机器人">
      <img src="../art/collectibles/space/planet-model.png" alt="行星模型">
    </div>
  </article>
  <article class="cover ocean">
    <header>
      <h2>海洋奇遇</h2>
      <p>标题由页面文字渲染，不画进图片。</p>
    </header>
    <div class="art">
      <img src="../art/collectibles/ocean/sea-turtle.png" alt="海龟">
      <img src="../art/collectibles/ocean/clownfish.png" alt="小丑鱼">
      <img src="../art/collectibles/ocean/little-whale.png" alt="小鲸鱼">
    </div>
  </article>
</body>
</html>
